<svg width="400" height="500" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="maroonBgBride" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4A1025"/>
      <stop offset="100%" stopColor="#2A0815"/>
    </linearGradient>
    <linearGradient id="goldBride" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF8EB"/>
      <stop offset="40%" stopColor="#E5D1A0"/>
      <stop offset="70%" stopColor="#C5A15A"/>
      <stop offset="100%" stopColor="#8C6D2D"/>
    </linearGradient>
    <radialGradient id="innerGlowBride" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stopColor="#C5A15A" stop-opacity="0.25"/>
      <stop offset="100%" stopColor="#C5A15A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Arch -->
  <path d="M 40 460 V 160 C 40 70, 200 30, 200 30 C 200 30, 360 70, 360 160 V 460 Z" fill="url(#maroonBgBride)" stroke="url(#goldBride)" stroke-width="2.5"/>
  <path d="M 52 450 V 168 C 52 85, 200 48, 200 48 C 200 48, 348 85, 348 168 V 450 Z" fill="none" stroke="url(#goldBride)" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>

  <circle cx="200" cy="200" r="140" fill="url(#innerGlowBride)"/>

  <!-- Bride Bridal Dupatta / Hijab & Jewellery Silhouette -->
  <g transform="translate(100, 110)">
    <!-- Graceful Bridal Veil / Dupatta Arch -->
    <path d="M 40 240 C 40 110, 70 70, 100 68 C 130 70, 160 110, 160 240 C 135 242, 65 242, 40 240 Z" fill="#641C32" stroke="url(#goldBride)" stroke-width="2"/>

    <!-- Delicate Dupatta Gold Border Kiran / Zari -->
    <path d="M 42 240 C 42 114, 72 74, 100 72 C 128 74, 158 114, 158 240" fill="none" stroke="url(#goldBride)" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Subtle Elegant Face Silhouette -->
    <circle cx="100" cy="120" r="30" fill="#F5EBD8" opacity="0.95"/>

    <!-- Bridal Maang Tikka / Matha Patti -->
    <path d="M 100 76 L 100 102" stroke="url(#goldBride)" stroke-width="2"/>
    <circle cx="100" cy="105" r="4.5" fill="url(#goldBride)"/>
    <circle cx="100" cy="105" r="2" fill="#FFF8EB"/>
    <path d="M 85 92 Q 100 98 115 92" stroke="url(#goldBride)" stroke-width="1.5" fill="none"/>

    <!-- Royal Bridal Necklace / Choker -->
    <path d="M 78 144 Q 100 156 122 144" stroke="url(#goldBride)" stroke-width="3" fill="none"/>
    <path d="M 74 152 Q 100 166 126 152" stroke="url(#goldBride)" stroke-width="2" fill="none"/>

    <!-- Embroidered Bridal Dress / Anarkali -->
    <path d="M 65 160 L 135 160 L 155 240 L 45 240 Z" fill="#4A1025" stroke="url(#goldBride)" stroke-width="1.5"/>
  </g>

  <!-- Name Label Plate -->
  <rect x="60" y="380" width="280" height="60" rx="8" fill="#2A0815" stroke="url(#goldBride)" stroke-width="1.5"/>
  <text x="200" y="405" text-anchor="middle" font-family="'Cinzel', serif" font-size="16" font-weight="700" fill="url(#goldBride)" letter-spacing="2">MUSKAN</text>
  <text x="200" y="425" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="13" font-style="italic" fill="#E5D1A0">M.Sc. Nursing • Bride</text>
</svg>
