<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4A1025"/>
      <stop offset="50%" stopColor="#641C32"/>
      <stop offset="100%" stopColor="#2A0815"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF8EB"/>
      <stop offset="35%" stopColor="#E5D1A0"/>
      <stop offset="70%" stopColor="#C5A15A"/>
      <stop offset="100%" stopColor="#8C6D2D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ornate Double Gold Border -->
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <rect x="42" y="42" width="1116" height="546" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6 4" opacity="0.7"/>

  <!-- Corner Filigree -->
  <circle cx="50" cy="50" r="10" fill="url(#goldGrad)"/>
  <circle cx="1150" cy="50" r="10" fill="url(#goldGrad)"/>
  <circle cx="50" cy="580" r="10" fill="url(#goldGrad)"/>
  <circle cx="1150" cy="580" r="10" fill="url(#goldGrad)"/>

  <!-- Bismillah Arabic -->
  <text x="600" y="125" text-anchor="middle" font-family="'Amiri', serif" font-size="44" font-weight="bold" fill="url(#goldGrad)">
    بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
  </text>

  <text x="600" y="175" text-anchor="middle" font-family="'Cinzel', serif" font-size="17" fill="#E5D1A0" letter-spacing="4">
    WITH THE BLESSINGS OF ALMIGHTY ALLAH
  </text>
  <text x="600" y="210" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="22" font-style="italic" fill="#FFF8EB">
    You Are Cordially Invited To Celebrate The Wedding Ceremony of
  </text>

  <!-- Couple Names -->
  <text x="600" y="295" text-anchor="middle" font-family="'Cinzel', serif" font-size="52" font-weight="700" fill="url(#goldGrad)" letter-spacing="3">
    MOHAMMAD FAIZAN
  </text>
  <text x="600" y="350" text-anchor="middle" font-family="'Great Vibes', cursive" font-size="42" fill="#FFF8EB">
    With
  </text>
  <text x="600" y="425" text-anchor="middle" font-family="'Cinzel', serif" font-size="52" font-weight="700" fill="url(#goldGrad)" letter-spacing="3">
    MUSKAN
  </text>

  <!-- Events Banner -->
  <rect x="250" y="475" width="700" height="85" rx="10" fill="#2A0815" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="425" y="512" text-anchor="middle" font-family="'Cinzel', serif" font-size="18" font-weight="700" fill="url(#goldGrad)">AQAD CEREMONY</text>
  <text x="425" y="538" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="16" fill="#FFF8EB">Friday, 8th Jan 2027 • 11:30 AM</text>

  <line x1="600" y1="485" x2="600" y2="550" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>

  <text x="775" y="512" text-anchor="middle" font-family="'Cinzel', serif" font-size="18" font-weight="700" fill="url(#goldGrad)">VALIMA RECEPTION</text>
  <text x="775" y="538" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="16" fill="#FFF8EB">Saturday, 9th Jan 2027 • 7:00 PM</text>
